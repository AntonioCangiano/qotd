# Sostituisce k8s/service.yaml: ClusterIP (la Route basta per l'esterno, NodePort non serve)
# e solo la porta che l'app usa davvero
apiVersion: v1
kind: Service
metadata:
  name: qotd
  labels:
    app: qotd
spec:
  type: ClusterIP
  selector:
    app: qotd
  ports:
  - name: 10000-tcp
    port: 10000
    targetPort: 10000
    protocol: TCP
