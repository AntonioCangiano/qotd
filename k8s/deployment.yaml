# Versione DevSecOps: niente annotazione image trigger, il tag SHA lo mette la pipeline
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qotd
  labels:
    app: qotd
spec:
  # niente "replicas": le decide l HPA (se ci fosse, ogni deploy le riporterebbe a 1)
  selector:
    matchLabels:
      app: qotd
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0            # durante l'aggiornamento non scende mai sotto le repliche volute
      maxSurge: 1
  template:
    metadata:
      labels:
        app: qotd
    spec:
      containers:
      - name: qotd
        image: image-registry.openshift-image-registry.svc:5000/acangiano04-dev/qotd:latest
        ports:
        - containerPort: 10000
          protocol: TCP
        resources:
          requests:                # quanto lo scheduler riserva; base per il calcolo dell'HPA
            cpu: 20m
            memory: 32Mi
          limits:                  # tetto massimo: oltre la memoria il pod viene ucciso (OOMKilled)
            cpu: 200m
            memory: 64Mi
        readinessProbe:            # finché fallisce, il pod non riceve traffico dal Service
          httpGet:
            path: /version
            port: 10000
          initialDelaySeconds: 2
          periodSeconds: 5
        livenessProbe:             # se fallisce 3 volte di fila, Kubernetes riavvia il container
          httpGet:
            path: /
            port: 10000
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
